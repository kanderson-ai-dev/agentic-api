[project]
name = "agentic-api"
version = "0.1.0"
description = "Production-grade FastAPI service exposing a guardrailed LangGraph agent with multi-turn memory, streaming, and full observability."
authors = [{ name = "Kaarsten Anderson" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["app"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "duckduckgo_search.*",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true
