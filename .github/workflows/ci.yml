name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}          # manual trigger also runs the live-e2e job
  schedule:
    - cron: "0 6 * * 1"          # weekly live end-to-end run against real APIs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      # No API keys are injected here: the suite runs fully offline against
      # deterministic fakes, so CI is green on a clean fork with zero secrets.
      - name: Run tests with coverage (offline, no secrets required)
        env:
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_PROJECT: agentic-api-ci
        run: pytest -v --cov=app --cov-report=term-missing

      # Offline gate: recomputes the audit hash chain and evaluates the
      # promoted prompt against the committed dataset with the deterministic
      # planner — a tampered registry.json or a metric regression fails the PR.
      - name: Verify prompt registry and promotion gate (offline)
        run: python -m app.services.prompt_eval --check

      # The README coverage badge is updated manually with exactly this number.
      - name: Report measured coverage (feeds the README badge)
        id: coverage
        run: |
          TOTAL=$(coverage report | tail -n1 | awk '{print $NF}')
          echo "coverage_total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Measured coverage: **${TOTAL}** — update the README badge only with this number." >> "$GITHUB_STEP_SUMMARY"

  live-e2e:
    name: Live end-to-end (manual/weekly, requires secrets)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Live run exercises the deployed stack only: real gpt-4o-mini + Langfuse
      # tracing. LangSmith stays a legacy opt-in path — no LANGCHAIN_* vars, so
      # the experiment test skips itself instead of burning a foreign quota.
      - name: Run tests against real OpenAI + observability backends
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://cloud.langfuse.com
          AGENTIC_LIVE_TESTS: "1"
        run: pytest -v

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Scan pinned dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the scan covers past commits too

      - name: Scan git history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentic-api:ci .
